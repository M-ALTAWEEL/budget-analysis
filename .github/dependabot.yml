# Dependabot opens a pull request when a dependency has a security fix or a new version.
# Each PR runs CI, so an update that breaks something shows a red ✗ before it is merged.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major versions change how things work, so we move to them on purpose, on a
      # branch, not from a bot. Security fixes still arrive, majors included.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # Minor and patch updates together, so they arrive as one PR instead of twenty.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
