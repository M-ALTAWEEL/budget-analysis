# Runs on every push and pull request: if anything here fails, GitHub shows a red ✗.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only reads the code.
permissions:
  contents: read

# A newer push to the same branch cancels the run that is no longer needed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real PostgreSQL, like docker-compose.yml: the tests run against a real database.
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: budgetbuddy
          POSTGRES_PASSWORD: budgetbuddy
          POSTGRES_DB: budgetbuddy
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budgetbuddy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://budgetbuddy:budgetbuddy@localhost:5432/budgetbuddy_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # A failure also becomes an annotation on the run, so it is readable from the API
      # and the pull request's checks page without opening the full log.
      - name: Tests (pytest)
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            tail -n 80 pytest.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/^/::error title=pytest::/'
            exit 1
          }

  frontend:
    name: Frontend (lint + types + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Types (TypeScript)
        run: npx tsc --noEmit

      # As for pytest: a failure becomes an annotation, readable without the full log.
      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log || {
            tail -n 60 build.log | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g' | sed -e 's/^/::error title=build::/'
            exit 1
          }

  mobile:
    name: Mobile (shared code + types)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      # The app copies the website's types, texts and API calls: they must not drift.
      - name: Shared files match the website
        run: node scripts/sync-shared.mjs --check

      - name: Install
        run: npm ci

      # expo-env.d.ts is generated on a developer's machine (and git-ignored).
      - name: Types (TypeScript)
        run: |
          echo '/// <reference types="expo/types" />' > expo-env.d.ts
          npx tsc --noEmit

  audit:
    name: Dependencies (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # pip-audit checks every installed package against the Python advisory database.
      - name: Python (pip-audit)
        working-directory: backend
        run: |
          pip install pip-audit ".[dev]"
          pip-audit --skip-editable

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Fails on high or critical advisories in what ships to users (dev tools excluded).
      - name: JavaScript (npm audit)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
