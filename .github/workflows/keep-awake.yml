# Render's free plan puts the API to sleep after 15 minutes without visitors, and waking
# it takes about a minute. This pings it every 14 minutes so visitors don't wait.
# (31 days x 24 h = 744 h, inside the free plan's 750 instance hours a month.)
# Set the repository variable API_URL (Settings > Secrets and variables > Actions >
# Variables) to the Render address, e.g. https://budgetbuddy-api.onrender.com
name: Keep API awake

on:
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.API_URL != '' }}
    steps:
      - run: curl --fail --silent --show-error --max-time 90 "${{ vars.API_URL }}/api/v1/ping"
