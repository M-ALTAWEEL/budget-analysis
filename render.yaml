# Render Blueprint: the API, twice.
# - budgetbuddy-api: production, deployed from the `main` branch (the real site).
# - budget-analysis-api-staging: staging, deployed from the `staging` branch, with its own
#   database and secrets. Every change is tried there before it reaches main.
# Render reads this file when you choose "New > Blueprint" and pick this repository.
services:
  - type: web
    name: budgetbuddy-api # kept: renaming a Blueprint service would create a new one
    runtime: docker
    rootDir: backend
    branch: main
    plan: free
    region: frankfurt
    # Checked often by Render: /ping does not touch the database, so the free
    # database can sleep when nobody is using the app.
    healthCheckPath: /api/v1/ping
    envVars:
      - key: APP_ENV
        value: production
      - key: DEPLOY_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true # a long random value made by Render, never in git
      - key: DATABASE_URL
        sync: false # pasted from Neon when the Blueprint is created
      - key: FRONTEND_URL
        sync: false # the site address(es), comma-separated, e.g. https://budgetanalysis.vercel.app
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false # optional: error reports
      - key: EDGE_SECRET
        sync: false # same value as EDGE_SECRET on Vercel (Production)

  - type: web
    name: budget-analysis-api-staging
    runtime: docker
    rootDir: backend
    branch: staging
    plan: free # sleeps when unused: fine for testing, and it saves instance hours
    region: frankfurt
    healthCheckPath: /api/v1/ping
    envVars:
      - key: APP_ENV
        value: production # behaves exactly like production (hidden docs, secure cookies)
      - key: DEPLOY_ENV
        value: staging
      - key: SECRET_KEY
        generateValue: true # its own key: staging tokens never work on production
      - key: DATABASE_URL
        sync: false # the Neon "staging" branch, never the production database
      - key: FRONTEND_URL
        sync: false # the Vercel preview addresses
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: EDGE_SECRET
        sync: false # same value as EDGE_SECRET on Vercel (Preview)
