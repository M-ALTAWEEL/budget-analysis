[project]
name = "budget-analysis-backend"
version = "0.1.0"
description = "Budget Analysis REST API - budget tracker with ML for students"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",  # needs Starlette >= 0.48 (HTTP_422_UNPROCESSABLE_CONTENT)
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "pyjwt[crypto]>=2.10",  # [crypto]: RS256, to check Google's signed ID tokens
    "bcrypt>=4.2",
    "slowapi>=0.1.9",
    "redis>=5.0",  # shared rate-limit counters when there is more than one server
    "httpx>=0.28",
    "sentry-sdk[fastapi]>=2.0",  # error reports, only active when SENTRY_DSN is set
    "segno>=1.6",  # QR codes for setting up 2FA (pure Python, no other dependencies)
    "phonenumbers>=8.13",  # phone numbers: validation, E.164, which country
    "openpyxl>=3.1",  # Excel reports (feature F5)
    "reportlab>=4.2",  # PDF reports (feature F5)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

# This is an application, not a library: "pip install ." installs the dependencies only.
# The code always runs from this folder (uvicorn, alembic and pytest all start here).
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
