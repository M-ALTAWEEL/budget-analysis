services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: budgetbuddy
      POSTGRES_PASSWORD: budgetbuddy
      POSTGRES_DB: budgetbuddy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budgetbuddy -d budgetbuddy"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Shared rate-limit counters, like production.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # A fake mail server: every email the API sends lands here, nothing leaves your computer.
  # Read them at http://localhost:8025 (backend/.env: EMAIL_BACKEND=smtp).
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025" # the inbox, in the browser
      - "1025:1025" # SMTP, where the API sends

  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      # Inside Docker the database host is the service name "db", not localhost.
      DATABASE_URL: postgresql+asyncpg://budgetbuddy:budgetbuddy@db:5432/budgetbuddy
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      # File-change events do not cross from Windows into the container, so poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount the code so changes reload without rebuilding the image.
      - ./backend:/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
